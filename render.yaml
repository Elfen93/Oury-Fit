# Despliegue en Render como sitio estático (gratis, no se duerme).
services:
  - type: web
    name: ouryfit
    runtime: static
    repo: https://github.com/elfen93/oury-fit
    branch: claude/happy-edison-27mjsq
    buildCommand: "echo sin compilacion"
    staticPublishPath: .
    routes:
      # Reenvía la autenticación de Neon por el mismo dominio de la app,
      # para que la cookie de sesión sea "de primera parte" en cualquier navegador.
      - type: rewrite
        source: /neon-auth/*
        destination: https://ep-frosty-wildflower-a1axnxg9.neonauth.ap-southeast-1.aws.neon.tech/neondb/auth/*
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
